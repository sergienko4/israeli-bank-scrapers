# SonarCloud Configuration
# Organization and project keys are injected via GitHub Actions secrets
# Do NOT hardcode sensitive identifiers here

sonar.sources=src
sonar.tests=src/Tests
sonar.test.inclusions=src/Tests/**/*.test.ts
# Legacy non-Pipeline scrapers + src/Common are excluded from SonarCloud
# analysis. Per project policy: migrated banks live under src/Scrapers/Pipeline/
# (which has its own 95% branch coverage threshold via jest.pipeline.config.cjs);
# unmigrated banks (Leumi, Yahav) ride
# the legacy src/Scrapers/<Bank>/ + src/Common/ + src/Scrapers/Registry/
# stack which is in maintenance-only mode (no new features, no enforced
# coverage). Excluding them here keeps the SonarCloud quality gate scoped
# to the Pipeline architecture which is the active surface.
sonar.exclusions=src/Tests/**,lib/**,node_modules/**,coverage/**,docs/**,tasks/**,**/EslintCanaries/**,src/Common/**,src/Scrapers/Leumi/**,src/Scrapers/Yahav/**,src/Scrapers/Registry/**

# Per-bank hard-model scrape shapes may be DELIBERATELY cloned across sibling
# banks under the zero-cross-bank-import convention: each bank's shape is
# self-contained (host + accounts + balance + transactions) so banks stay
# decoupled and independently evolvable rather than sharing a base that
# couples them.
# Sonar's copy-paste detector counts these intentional clones as new-code
# duplication. Exclude the scrape shapes from CPD ONLY — bugs, coverage,
# and code smells remain fully enforced on them.
#
# Bank groups are the standing exception. The FIBI group (Beinleumi,
# Massad, OtsarHahayal, Pagi) and the Telebank group (Discount,
# Mercantile) hoist their shared logic into the neutral
# Phases/ApiDirectScrape/FibiGroup/ and Phases/ApiDirectScrape/TelebankGroup/
# factories, so those banks re-export rather than clone. The factories sit
# outside this exclusion and ARE CPD-analysed — cloning them back into
# per-bank scrape/ folders to dodge a duplication finding would be a
# regression, not a fix. What remains in each group bank's scrape/ folder
# is only its own binding.
sonar.cpd.exclusions=src/Scrapers/Pipeline/Banks/**/scrape/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info,src/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info,src/coverage/lcov.info

# Block PR merge if quality gate fails
sonar.qualitygate.wait=true

sonar.issue.ignore.multicriteria=jsonUnknownAlias,protocolMd5,riskMinderCollectorVersion,riskMinderRadioVersion,loopbackNetmask

# `Types/JsonValue.ts` declares `type JsonUnknown = unknown`, the single
# name for "a boundary value nobody has narrowed yet". S6564 flags it as a
# redundant alias because it carries no type information — true, and beside
# the point: the NAME is the contract. It marks an OPAQUE boundary — a value
# carrying no structural guarantee — and is the vocabulary
# JsonValueSingleSource.test.ts uses to tell the open arm from the closed
# ones. It does not today keep bare `unknown` out of Pipeline signatures:
# those selectors are drain-queued in eslint.config.mjs.
#
# Each obvious direct alternative is blocked by another enabled gate
# (verified by running each): `NonNullable<unknown>` trips no-generated-empty-object-type (resolves
# to `{}`), `JsonValue | unknown` trips no-redundant-type-constituents, and
# `JsonValue | object` trips tsc with 20 diagnostics at boundary call sites
# that pass `unknown` in by design. Mirrors the ESLint-side exemption in
# eslint.config.mjs — both are FILE-scoped, the narrowest scope either tool
# supports, so both also silence S6564 for the closed arms in that file;
# JsonValueSingleSource.test.ts restores the declaration-level guard. May
# only ever be narrowed, never widened.
sonar.issue.ignore.multicriteria.jsonUnknownAlias.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.jsonUnknownAlias.resourceKey=src/Scrapers/Pipeline/Types/JsonValue.ts

# `md5-hex` derives a bank-protocol identifier: the remote checks the MD5
# digest and no security property (integrity, authentication, password
# storage) depends on it. The op is part of the bank's wire contract, so it
# cannot be replaced by a stronger hash; S4790 flags the algorithm name only.
# Scoped to the one function that implements that contract.
sonar.issue.ignore.multicriteria.protocolMd5.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.protocolMd5.resourceKey=src/Scrapers/Pipeline/Mediator/ApiDirectCall/Flow/Lifecycle/FlowInitCarry.ops.ts

# The RiskMinder `collector` version (`8.2.4.1`) and the `radio` baseband
# value (`1.0.0.0`) are Android version strings, not IP endpoints. S1313
# matches their dotted shape; the bank receives them as opaque vendor data.
sonar.issue.ignore.multicriteria.riskMinderCollectorVersion.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.riskMinderCollectorVersion.resourceKey=src/Scrapers/Pipeline/Mediator/ApiDirectCall/DeviceIdentity/Formats/RiskMinderMfp.ts

sonar.issue.ignore.multicriteria.riskMinderRadioVersion.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.riskMinderRadioVersion.resourceKey=src/Scrapers/Pipeline/Mediator/ApiDirectCall/DeviceIdentity/Formats/RiskMinderMfpBlocks.ts

# The loopback fallback's netmask is `255.0.0.0` — a /8 mask, not an address.
# It is used only when the host exposes no non-internal IPv4 interface.
sonar.issue.ignore.multicriteria.loopbackNetmask.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.loopbackNetmask.resourceKey=src/Scrapers/Pipeline/Mediator/ApiDirectCall/DeviceIdentity/HostProfile.ts
