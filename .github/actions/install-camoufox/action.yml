name: Install Camoufox Browser
description: Cache and install the Camoufox anti-detect browser with authenticated fallback

inputs:
  gh-token:
    description: GitHub token for authenticated release download fallback
    required: true

runs:
  using: composite
  steps:
    # Camoufox is pinned to the v152 stable line (exact tag: browser-stack.json),
    # matching @hieutran094/camoufox-js ^0.11.2 and playwright-core
    # ^1.62.0 in package.json (Firefox 152 juggler protocol). playwright
    # 1.61 shipped the Firefox 151 client and 1.62 ships Firefox 153, so
    # v152 is the only Camoufox line inside that window. Upstream
    # declared the previous v135 pin obsolete ("terribly out of date and
    # unsuitable for modern anti-bot systems"), and v152.0.4-beta.26
    # restored locale-from-launch-argument handling plus the screenshot,
    # popup-event and tap/touch paths Firefox 152 initially broke.
    # playwright still needs the guard on pageError.location (Camoufox
    # omits it) — see scripts/patch-playwright-core.mjs. camoufox-js
    # resolves the newest release inside its own supported range rather
    # than an exact tag, so the install step never asks it: it installs
    # the pinned tag's release asset, keeping the pinned cache key
    # deterministic. Do
    # NOT let the fallback track LATEST: v150.0.2's locale handling
    # regressed `navigator.language` (returned `en-US` even when the
    # context declared `he-IL`), breaking `AntiDetection.e2e-mocked.test.ts`.
    # From v152.0.2-alpha upstream no longer builds 32-bit or macOS
    # x86_64 assets; CI only consumes `camoufox-*-lin.x86_64.zip`.
    - name: Resolve pinned Camoufox tag
      id: camoufox-tag
      shell: bash
      # Single source of truth for the pinned tag: `camoufox.tag` in
      # browser-stack.json, read through the manifest validator, which fails
      # closed (exit 2, MANIFEST-INVALID) unless the WHOLE manifest is valid.
      # The cache key below uses this output and install.sh reads the same
      # manifest, so a tag bump in the manifest invalidates the cache and
      # re-pins the install in one edit; never hardcode the version here.
      run: |
        set -euo pipefail
        tag=$(node "${GITHUB_WORKSPACE}/scripts/browser-stack/manifest.mjs" tag)
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
    - name: Cache Camoufox browser
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.cache/camoufox
        # Cache the deterministic v152 binary, keyed by the exact pinned
        # tag; the install step below refuses to populate this key with
        # any other release. The path is install.sh's default directory: a
        # job that sets CAMOUFOX_INSTALL_DIR still gets the pinned build,
        # only uncached.
        key: camoufox-bin-${{ steps.camoufox-tag.outputs.tag }}
    - name: Install Camoufox browser
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      # The same script builds docker/Dockerfile.ci-mirror. It reads the tag
      # from browser-stack.json (as the cache key above does), skips a cache
      # hit and installs the pinned release asset on a miss.
      run: bash "${GITHUB_WORKSPACE}/.github/actions/install-camoufox/install.sh"
