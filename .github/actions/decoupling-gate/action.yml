# Decoupling regression gate — measures the architecture of this PR AND of
# its merge base, then refuses changes that loosen it.
#
# Against the merge base rather than the committed baseline snapshot: that
# baseline is refreshed by hand, so it drifts behind main and a diff against
# it measures everything merged since it was taken. The merge base is exact
# and needs no maintenance.
#
# Guardrail metrics are ratchets, not budgets — a new import cycle, a new
# `any`, or a deleted canary / ESLint rule fails outright. See
# decoupling-compare.sh for the policy.
#
# Runs as a background step of pr.yml's `static-checks` job. The caller
# checks out with `fetch-depth: 0` (the base tree is a second worktree),
# installs node_modules first, and sets `THRESHOLD_PCT` in the calling
# step's `env:`, which the runner passes to every step below.
name: Decoupling gate
description: >-
  Measures the architecture of the PR and of its merge base with HEAD's copy
  of scripts/decoupling-metrics, and fails when a ratchet goes backwards or
  average fan-out grows by more than THRESHOLD_PCT. The caller must check out
  with fetch-depth 0 and install dependencies first.

runs:
  using: composite
  steps:
    # HEAD's `node_modules` serves both measurements: the tool is always
    # HEAD's copy, so `typescript` resolves from HEAD's tree even when the
    # target is the base worktree. The base tree needs no install of its own.
    - name: Measure this PR
      shell: bash
      run: node scripts/decoupling-metrics/measure.mjs . head head.json
    - name: Check out the merge base
      id: base_tree
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      shell: bash
      run: |
        set -euo pipefail
        # The base SHA comes from the event rather than `HEAD^1`: if the PR
        # is not cleanly mergeable there is no merge commit to take a first
        # parent from, and that would silently compare against the wrong
        # tree instead of failing loudly.
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          echo "::notice::Base commit ${BASE_SHA} is not available - skipping the comparison."
          exit 0
        fi
        git worktree add ../base "$BASE_SHA" \
          || echo "::notice::Could not materialise the base tree - skipping the comparison."
    # HEAD's copy of the tool measures BOTH trees, so a change to the tool
    # itself cannot masquerade as a change in the architecture.
    - name: Measure the merge base
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d ../base ]; then
          exit 0
        fi
        # A base tree that cannot be measured must not block the PR. Drop any
        # half-written snapshot so the comparison reports "not measured"
        # rather than failing on invalid JSON, which is reserved for a tool
        # that is genuinely broken.
        if ! node scripts/decoupling-metrics/measure.mjs ../base base base.json; then
          rm -f scripts/decoupling-metrics/snapshots/base.json
          echo "::notice::Could not measure the merge base - skipping the comparison."
        fi
    - name: Compare against the merge base
      env:
        BASE_SNAPSHOT: scripts/decoupling-metrics/snapshots/base.json
        HEAD_SNAPSHOT: scripts/decoupling-metrics/snapshots/head.json
      shell: bash
      run: bash .github/scripts/ci/decoupling-compare.sh
    - name: Append the full decoupling matrix
      if: hashFiles('scripts/decoupling-metrics/snapshots/base.json') != ''
      shell: bash
      run: |
        set -euo pipefail
        {
          echo ""
          echo "<details><summary>Full decoupling matrix</summary>"
          echo ""
          node scripts/decoupling-metrics/diff.mjs \
            scripts/decoupling-metrics/snapshots/base.json \
            scripts/decoupling-metrics/snapshots/head.json
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
