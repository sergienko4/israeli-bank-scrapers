name: "CodeQL config — Pipeline scope"

# Ignore vendored bank HTML fixtures captured for offline mock E2E tests.
# These files are real bank dashboard HTML (Hapoalim/Discount/Max/VisaCal/etc.)
# and are NOT our source code; they are loaded read-only by the mocked E2E
# tests. Their JS never executes in production. CodeQL findings inside them
# are noise about the bank's own client-side code.
paths-ignore:
  - 'src/Tests/**/fixtures/**'
  - 'src/Tests/E2eMocked/**/snapshots/**'
  - 'src/Tests/Tools/**'

queries:
  - uses: security-extended

query-filters:
  # The review-agent scripts intentionally fetch PR data into files and send a
  # sanitized review back to the GitHub API. These two taint queries model that
  # deliberate flow; the workflow threat model, path guard and unit tests cover
  # it instead. Keep the scripts in analysis for every other query.
  - exclude:
      id: js/file-access-to-http
  - exclude:
      id: js/http-to-file-access
