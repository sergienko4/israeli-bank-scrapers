name: Release & Publish

# Called by `main-pipeline.yml`. This workflow deliberately has no trigger of
# its own, so a merge to main produces exactly one run containing both the
# verification scans and the release.
#
# npm Trusted Publishing: for `workflow_call`, npm validates the *calling*
# workflow's name, not this file — and requires `id-token: write` on both the
# parent and the child (https://docs.npmjs.com/trusted-publishers/,
# Troubleshooting). Because this file is invoked from `main-pipeline.yml`, the
# trusted publisher configured on npmjs.com must name **main-pipeline.yml**.
# Giving this file a `push:` trigger again without repointing that setting
# would publish under a claim npm rejects.
on:
  workflow_call:
    inputs:
      force_publish:
        description: 'Publish to npm even when release-please cut no release (recovers from tag glitches)'
        required: false
        default: 'false'
        type: string
    outputs:
      release_created:
        description: 'true when release-please cut a release on this run'
        value: ${{ jobs.release-please.outputs.release_created }}
      version:
        description: 'Version released on this run; empty when no release was cut'
        value: ${{ jobs.release-please.outputs.version }}
    secrets:
      RELEASE_TOKEN:
        description: 'PAT with contents:write — release-please needs it for cross-branch release commits'
        required: true

# Top-level least-privilege baseline — closes code-scanning alert #32
# (Scorecard `TokenPermissionsID`). The release-please job overrides locally to
# `contents: write` + `pull-requests: write` because it needs to push
# release commits and PRs; the publish job overrides locally to
# `contents: read` + `id-token: write` for the npm OIDC trust chain.
# Other jobs in this workflow inherit the read-only default.
permissions:
  contents: read

# No `concurrency:` here on purpose. A called workflow is governed by the
# caller's concurrency group, so declaring a second one would add a nested
# queue that can deadlock against it. `main-pipeline.yml` carries the policy
# this workflow needs — `cancel-in-progress: false`, because a half-published
# release is worse than a queued one.

# ──────────────────────────────────────────────────────────────
# Job DAG:
#
#   release-please ─┬─→ upgrade-notes (if release_created)
#                   └─→ publish       (if release_created)
#
# No validate job — PR checks already passed before merge.
# Publish uses npm ci + build (clean reproducible build for
# provenance attestation). PR workflow validates correctness.
# ──────────────────────────────────────────────────────────────

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # `release-please` emits the *string* `'false'` when it cuts no release,
      # and every non-empty string is truthy in a GitHub expression — so a bare
      # `||` fallback would always pick `'false'` and silently ignore
      # `force_publish`. Compare both sides explicitly.
      release_created: ${{ steps.release.outputs.release_created == 'true' || inputs.force_publish == 'true' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }} # PAT with contents:write — needed for cross-branch release commits
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please writes the changelog (what changed); this adds the part a
  # consumer actually needs on upgrade (whether they must do anything). Runs
  # only for real releases — a `force_publish` dispatch has no tag to edit.
  upgrade-notes:
    name: Append upgrade notes
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Append the Upgrading section to the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > body.md
          # Re-runs of this workflow must not stack duplicate sections.
          if grep -qF "## Upgrading to ${VERSION}" body.md; then
            echo "Upgrading section already present for ${VERSION} — nothing to do."
            exit 0
          fi
          printf '\n\n' >> body.md
          node scripts/upgrade-notes.mjs --version "$VERSION" >> body.md
          gh release edit "$TAG" --notes-file body.md

  publish:
    name: Publish to NPM
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # npm scans every publish before the version becomes installable, so most
    # of this job is spent waiting for the registry rather than working. The
    # cap has to clear `verify-npm-publish.sh`'s whole budget plus checkout,
    # `npm ci` and the build, or the runner kills the poll before the gate can
    # pass — which is exactly how release 8.7.2 went red after shipping fine.
    # `ReleasePublishAvailabilityGate.test.ts` fails if this drops below the
    # verifier's budget.
    timeout-minutes: 30
    environment: npm-publish
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `npm publish` reads from the working tree but never pushes
          # back to git — release-please publishes the tag/release in
          # its own job above. Closes zizmor `artipacked`.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Trusted Publishing requires npm 11.5.1+ (npm docs, "Trusted
          # publishing for npm packages"). No Node 22 release bundles it —
          # 22.x stops at npm 10 — while Node 24.5+ does, so this job runs on
          # Node 24, as npm's own GitHub Actions example does, instead of
          # `.nvmrc`. That retires the `npm install -g npm@…` self-upgrade
          # Scorecard reported as an unpinned download (code-scanning alert
          # #35); Scorecard does not count an exact version as a pin.
          # `.nvmrc` stays the development toolchain, and Node 24 is a leg of
          # the unit-test matrix in pr.yml.
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Require npm 11.5.1+ for Trusted Publishing
        # `node-version: '24'` can resolve to a 24.x already cached on the
        # runner, and 24.0–24.4 bundle an older npm. Without this check the
        # OIDC exchange is skipped and publish dies with ENEEDAUTH.
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          if ! printf '11.5.1\n%s\n' "$NPM_VERSION" | sort -V -C; then
            echo "::error::npm ${NPM_VERSION} is older than 11.5.1, which Trusted Publishing requires."
            exit 1
          fi
          echo "npm ${NPM_VERSION} supports Trusted Publishing."
      - run: npm ci
      - uses: $/.github/actions/build-package
      - name: Publish with provenance (Trusted Publishing OIDC)
        # `npm publish` is not idempotent: once the registry has accepted a
        # tarball, every later attempt fails with "cannot publish over the
        # previously published versions". Combined with npm's publish-time
        # scan that makes a re-run useless — the first attempt publishes, its
        # verification times out waiting for the scan, and the re-run that
        # should recover the release instead dies on the conflict. Both runs
        # red, permanently.
        #
        # So this step does not get to decide whether the release shipped.
        # It records what happened and the verification below reads the answer
        # back from the registry, which is the only place that actually knows.
        # A pre-publish existence check cannot substitute: while scanning is
        # pending the version is absent from the packument, so "not there yet"
        # and "never published" are indistinguishable from outside.
        run: |
          set -euo pipefail
          if npm publish --access public --provenance; then
            echo "PUBLISH_OUTCOME=accepted" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_OUTCOME=rejected" >> "$GITHUB_ENV"
            echo "::warning::npm publish exited non-zero. If a previous attempt already published this version that is expected; the registry check below decides."
          fi

      # `npm publish` exiting 0 proves the registry accepted the tarball, not
      # that consumers can install it — `dist-tags.latest` can still point at
      # the previous release, a degraded OIDC exchange publishes without
      # provenance rather than failing, and since publish-time scanning a
      # version is not installable for minutes after it is accepted. Read it
      # back as a consumer would. This is the step that decides the release.
      - name: Verify the release is installable
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          echo "npm publish outcome: ${PUBLISH_OUTCOME:-unknown}"
          PKG_NAME=$(node -p "require('./package.json').name")
          bash .github/scripts/ci/verify-npm-publish.sh "$PKG_NAME" "$VERSION"

  # A release-please release that never reaches npm is the worst outcome
  # available: the tag, the GitHub release and the changelog all exist, so
  # every human signal says "shipped", while `npm install` still serves the
  # previous version. That happens whenever `publish` is SKIPPED rather than
  # failed — a skipped job is not a red workflow, so nothing raises a hand.
  # This job runs whenever a release was created and fails unless `publish`
  # actually succeeded, converting silence into a failed run.
  release-complete:
    name: Release reached npm
    needs: [release-please, publish]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish job must have succeeded
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RESULT" = "success" ]; then
            echo "v${VERSION} published and verified on npm."
            exit 0
          fi
          echo "ERROR: release v${VERSION} was created but the publish job" >&2
          echo "       reported '${PUBLISH_RESULT}'. The git tag, GitHub release" >&2
          echo "       and CHANGELOG all claim this version shipped, but npm is" >&2
          echo "       still serving the previous one." >&2
          exit 1
