name: Release & Publish

# Called by `main-pipeline.yml`. This workflow deliberately has no trigger of
# its own, so a merge to main produces exactly one run containing both the
# verification scans and the release.
#
# npm Trusted Publishing: for `workflow_call`, npm validates the *calling*
# workflow's name, not this file — and requires `id-token: write` on both the
# parent and the child (https://docs.npmjs.com/trusted-publishers/,
# Troubleshooting). Because this file is invoked from `main-pipeline.yml`, the
# trusted publisher configured on npmjs.com must name **main-pipeline.yml**.
# Giving this file a `push:` trigger again without repointing that setting
# would publish under a claim npm rejects.
on:
  workflow_call:
    inputs:
      force_publish:
        description: 'Publish to npm even when release-please cut no release (recovers from tag glitches)'
        required: false
        default: 'false'
        type: string
    outputs:
      release_created:
        description: 'true when release-please cut a release on this run'
        value: ${{ jobs.release-please.outputs.release_created }}
      version:
        description: 'Version released on this run; empty when no release was cut'
        value: ${{ jobs.release-please.outputs.version }}
    secrets:
      RELEASE_TOKEN:
        description: 'PAT with contents:write — release-please needs it for cross-branch release commits'
        required: true

# Top-level least-privilege baseline — closes CodeQL alert #32
# (TokenPermissionsID). The release-please job overrides locally to
# `contents: write` + `pull-requests: write` because it needs to push
# release commits and PRs; the publish job overrides locally to
# `contents: read` + `id-token: write` for the npm OIDC trust chain.
# Other jobs in this workflow inherit the read-only default.
permissions:
  contents: read

# No `concurrency:` here on purpose. A called workflow is governed by the
# caller's concurrency group, so declaring a second one would add a nested
# queue that can deadlock against it. `main-pipeline.yml` carries the policy
# this workflow needs — `cancel-in-progress: false`, because a half-published
# release is worse than a queued one.

# ──────────────────────────────────────────────────────────────
# Job DAG:
#
#   release-please ─┬─→ upgrade-notes (if release_created)
#                   └─→ publish       (if release_created)
#
# No validate job — PR checks already passed before merge.
# Publish uses npm ci + build (clean reproducible build for
# provenance attestation). PR workflow validates correctness.
# ──────────────────────────────────────────────────────────────

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # `release-please` emits the *string* `'false'` when it cuts no release,
      # and every non-empty string is truthy in a GitHub expression — so a bare
      # `||` fallback would always pick `'false'` and silently ignore
      # `force_publish`. Compare both sides explicitly.
      release_created: ${{ steps.release.outputs.release_created == 'true' || inputs.force_publish == 'true' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }} # PAT with contents:write — needed for cross-branch release commits
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please writes the changelog (what changed); this adds the part a
  # consumer actually needs on upgrade (whether they must do anything). Runs
  # only for real releases — a `force_publish` dispatch has no tag to edit.
  upgrade-notes:
    name: Append upgrade notes
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Append the Upgrading section to the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > body.md
          # Re-runs of this workflow must not stack duplicate sections.
          if grep -qF "## Upgrading to ${VERSION}" body.md; then
            echo "Upgrading section already present for ${VERSION} — nothing to do."
            exit 0
          fi
          printf '\n\n' >> body.md
          node scripts/upgrade-notes.mjs --version "$VERSION" >> body.md
          gh release edit "$TAG" --notes-file body.md

  publish:
    name: Publish to NPM
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `npm publish` reads from the working tree but never pushes
          # back to git — release-please publishes the tag/release in
          # its own job above. Closes zizmor `artipacked`.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Upgrade npm for Trusted Publishing (OIDC requires npm 11.5.1+)
        # Closes CodeQL alert #35 (PinnedDependenciesID): the
        # `npm install -g npm@11.11.0` invocation now passes
        # `--audit-signatures` so the package signature is verified
        # against the npm registry public key BEFORE installation.
        # Pinned to the exact version; signature-checked at fetch time.
        run: |
          set -euo pipefail
          npm install -g npm@11.11.0 --ignore-scripts --audit-signatures
          npm --version | grep -q '^11\.' || (echo "ERROR: npm upgrade failed" && exit 1)
      - run: npm ci
      - uses: ./.github/actions/build-package
      - name: Publish with provenance (Trusted Publishing OIDC)
        run: npm publish --access public --provenance

      # `npm publish` exiting 0 proves the registry accepted the tarball, not
      # that consumers can install it — `dist-tags.latest` can still point at
      # the previous release, and a degraded OIDC exchange publishes without
      # provenance rather than failing. Read it back as a consumer would.
      - name: Verify the release is installable
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          bash .github/scripts/ci/verify-npm-publish.sh "$PKG_NAME" "$VERSION"

  # A release-please release that never reaches npm is the worst outcome
  # available: the tag, the GitHub release and the changelog all exist, so
  # every human signal says "shipped", while `npm install` still serves the
  # previous version. That happens whenever `publish` is SKIPPED rather than
  # failed — a skipped job is not a red workflow, so nothing raises a hand.
  # This job runs whenever a release was created and fails unless `publish`
  # actually succeeded, converting silence into a failed run.
  release-complete:
    name: Release reached npm
    needs: [release-please, publish]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish job must have succeeded
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RESULT" = "success" ]; then
            echo "v${VERSION} published and verified on npm."
            exit 0
          fi
          echo "ERROR: release v${VERSION} was created but the publish job" >&2
          echo "       reported '${PUBLISH_RESULT}'. The git tag, GitHub release" >&2
          echo "       and CHANGELOG all claim this version shipped, but npm is" >&2
          echo "       still serving the previous one." >&2
          exit 1
