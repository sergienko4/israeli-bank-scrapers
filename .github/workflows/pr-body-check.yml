name: PR Body Compliance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  body-check:
    name: Validate PR body sections
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Checked out for the migration-note gate below, which needs commit
      # history. `fetch-depth: 0` because the PR base may be far behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert mandatory PR-body sections
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Bot-authored PRs (Dependabot, release-please) cannot generate the §10
            // guideline-compliance table by design. Exempt them so dependency bumps and
            // release PRs are not blocked from auto-merge. Human PRs remain enforced.
            // Shared with the cited-path check below so both gates exempt the same set.
            const isBotPr = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci/is-bot-pr.cjs`);
            const pr = context.payload.pull_request;
            if (isBotPr(pr)) {
              core.info(
                `PR-body check skipped — bot-authored PR (author='${pr.user?.login ?? ''}', head='${pr.head?.ref ?? ''}').`,
              );
              return;
            }

            const body = pr.body || '';
            const required = [
              { header: '## Guideline compliance', cite: 'pr-guidlines.md §10' },
              { header: '## Why',                  cite: 'pr-guidlines.md §7'  },
              { header: '## What',                 cite: 'pr-guidlines.md §7'  },
            ];
            const missing = required.filter(({ header }) => !body.includes(header));
            if (missing.length > 0) {
              const lines = missing.map(({ header, cite }) => `  - ${header}  (${cite})`);
              core.setFailed(
                [
                  'PR body is missing one or more mandatory sections:',
                  ...lines,
                  '',
                  'See .github/PULL_REQUEST_TEMPLATE.md for the canonical layout.',
                  'See pr-guidlines.md §7 (Why/What) and §10 (Guideline compliance) for content rules.',
                ].join('\n'),
              );
              return;
            }
            core.info('PR body contains all mandatory sections ✓');

      # Lives here rather than in pr.yml because this workflow runs on every
      # PR unconditionally. In pr.yml the enclosing job is path-filtered, so a
      # breaking change arriving through an unfiltered path would skip the
      # gate entirely - the exact silent-omission failure this prevents.
      #
      # Applies to bot PRs too: the exemption above covers the guideline
      # table, which bots cannot author, not the migration note, which is a
      # correctness requirement for consumers.
      - name: Breaking changes carry a migration note
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-breaking-note.mjs

      # Agent-facing docs cite repo-root-relative paths. CLAUDE.md is loaded
      # by every agent session, and all seven of its "Key Files" entries went
      # stale unnoticed when src/ was restructured - an agent that trusts a
      # phantom path burns an investigation on a file that is not there.
      # Unconditional, including bot PRs: a dependency bump that moves a file
      # rots these citations exactly as a human PR would.
      - name: Cited paths in agent docs resolve
        run: npm run lint:doc-paths

      # The PR body is checked separately because it is not a repo file.
      # Written via github-script rather than interpolated into `run:` —
      # `${{ github.event.pull_request.body }}` in a shell line is a script
      # injection vector, since the body is attacker-controlled text.
      - name: Stage PR body for path check
        id: stage-body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const isBotPr = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci/is-bot-pr.cjs`);
            const pr = context.payload.pull_request;
            // Bot bodies are generated changelogs citing paths across the whole
            // history, including files since moved. Holding them to this gate
            // would block release PRs for drift they did not introduce.
            if (isBotPr(pr)) {
              core.info(`PR-body path check skipped — bot PR (author='${pr.user?.login ?? ''}').`);
              core.setOutput('skip', 'true');
              return;
            }
            fs.writeFileSync('pr-body-ci.md', pr.body || '');
            core.setOutput('skip', 'false');

      - name: Cited paths in PR body resolve
        if: steps.stage-body.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-doc-paths.mjs --diff-base "$BASE_SHA" pr-body-ci.md
