name: Workflow Security Scan

on:
  # `push: main` intentionally absent — main-pipeline.yml calls this via
  # workflow_call. A reusable call cannot carry a `paths:` filter, so the
  # post-merge scan now runs on every merge rather than only on workflow
  # edits. That is deliberate: it is a ~1 minute security scan, and always
  # verifying hardening on main is worth more than the saved minute.
  # PR runs keep the path filter below and are unchanged.
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor (workflow CVE / hardening)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor

      - name: Run zizmor on every workflow file
        run: |
          set -euo pipefail
          zizmor --format sarif .github/workflows > zizmor.sarif || true

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
