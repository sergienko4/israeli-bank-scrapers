name: CodeQL

on:
  # `push: main` intentionally absent — main-pipeline.yml calls this via
  # workflow_call so the post-merge run appears as one DAG instead of a
  # separate check. PR and scheduled runs are unchanged.
  workflow_call:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC

# A newer push to the same PR cancels this run; see pr.yml. A main-pipeline
# call or a scheduled run keys on its own `run_id`, so it is never cancelled.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Pinned alongside `category` below because `github/codeql-action`
      # derives `analysis_key` separately from `category`, defaulting to
      # "<caller-workflow-path>:<job-name>". Without this env var,
      # `main-pipeline.yml` (`workflow_call`) uploads under
      # `.github/workflows/main-pipeline.yml:analyze` — a job key that does
      # not exist in `main-pipeline.yml` and differs from PR/scheduled runs.
      CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          # Pinned because the category otherwise defaults to
          # "<caller-workflow-path>:<job-name>". This workflow has two callers:
          # `pull_request` here, and `main-pipeline.yml` via `workflow_call`.
          # Letting it default gave the post-merge run a different category from
          # the PR run, so main advertised a second code scanning configuration
          # that no pull request could ever produce, and code scanning reported
          # "1 configuration not found" on every one of them.
          #
          # Merge protection requires *every* configuration present on main, so
          # renaming this to anything else only swaps which one is missing. The
          # value is therefore the long-lived category shared by the existing
          # analyses — keep it stable.
          category: .github/workflows/codeql.yml:analyze

  # The review-agent scripts are analyzed on their own so their deliberate
  # file<->HTTP flows can be excluded without weakening the pipeline scan.
  analyze-review-agent:
    name: CodeQL Security Scan (review agent)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Keep the category stable across `pull_request`, `workflow_call` and
      # scheduled runs, matching the main analysis job.
      CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze-review-agent
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-review-agent.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: .github/workflows/codeql.yml:analyze-review-agent
