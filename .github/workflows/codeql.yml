name: CodeQL

on:
  # `push: main` intentionally absent — main-pipeline.yml calls this via
  # workflow_call so the post-merge run appears as one DAG instead of a
  # separate check. PR and scheduled runs are unchanged.
  workflow_call:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC

permissions: {}

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          # Pinned because the category otherwise defaults to
          # "<caller-workflow-path>:<job-name>". This workflow has two callers:
          # `pull_request` here, and `main-pipeline.yml` via `workflow_call`.
          # Letting it default gave the post-merge run a different category from
          # the PR run, so main advertised a second code scanning configuration
          # that no pull request could ever produce, and code scanning reported
          # "1 configuration not found" on every one of them.
          #
          # Merge protection requires *every* configuration present on main, so
          # renaming this to anything else only swaps which one is missing. The
          # value is therefore the long-lived category shared by the existing
          # analyses — keep it stable.
          category: .github/workflows/codeql.yml:analyze
