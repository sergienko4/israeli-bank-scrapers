name: OSSF Scorecard

on:
  schedule:
    - cron: '30 2 * * 1'
  # On-demand runs. The weekly cadence alone meant a dependency fixed on a
  # Tuesday stayed reported until the following Monday — alert 63 sat open as
  # "high" for days after `9ebcbc7` had already fixed both browserslist
  # advisories it named, with no way to ask for a re-scan. See
  # docs/workflow/code-scanning.md for how to triage what it reports.
  workflow_dispatch:

permissions: {}

# NOTE: workflow-root `env:` and `defaults:` are forbidden by the
# OSSF scorecard-action signature verifier. Any flag formerly set
# here MUST move to step-level env, otherwise the signature step
# rejects the workflow with "workflow contains global env vars or
# defaults". See:
#   https://github.com/ossf/scorecard-action#workflow-restrictions

jobs:
  # With `publish_results: true` the scorecard.dev API rejects the run unless
  # every step of this job is an approved `uses:` action (checkout,
  # upload-artifact, upload-sarif, scorecard-action, harden-runner), and only
  # this job may hold `id-token: write`. Any `run:` step therefore lives in
  # `analysis` below. See
  #   https://github.com/ossf/scorecard-action#workflow-restrictions
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read only: the SAST check queries code scanning; uploading moved below.
      security-events: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

  # Scorecard v2.4.4 predates GitHub's `$/` self-repository syntax and
  # misreports every `uses: $/…` reference as an unpinned third-party action
  # (28 false PinnedDependenciesID alerts). Reverting the syntax is not an
  # option: zizmor's `self-repository` audit requires `$/` and GitHub treats
  # it as a form of pinning. So strip only those false positives from the
  # SARIF before it is uploaded — a genuinely unpinned third-party action
  # never matches `$/`, so it is still reported. The downloaded copy is owned
  # by the runner user; the original is written as root by the Scorecard
  # container and cannot be rewritten in place.
  # See docs/workflow/code-scanning.md and ossf/scorecard#5191.
  #
  # Keep this job key `analysis`. upload-sarif files each upload under
  # `<workflow path>:<job key>`, and every existing Scorecard alert belongs to
  # `.github/workflows/scorecard.yml:analysis`. Under another key those
  # alerts would never close without a manual configuration delete.
  analysis:
    name: Upload filtered SARIF
    needs: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SARIF file
      - name: Drop $/ self-repository false positives from the SARIF
        run: node scripts/filter-scorecard-sarif.mjs results.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
