name: OSSF Scorecard

on:
  schedule:
    - cron: '30 2 * * 1'
  # On-demand runs. The weekly cadence alone meant a dependency fixed on a
  # Tuesday stayed reported until the following Monday — alert 63 sat open as
  # "high" for days after `9ebcbc7` had already fixed both browserslist
  # advisories it named, with no way to ask for a re-scan. See
  # docs/workflow/code-scanning.md for how to triage what it reports.
  workflow_dispatch:

permissions: {}

# NOTE: workflow-root `env:` and `defaults:` are forbidden by the
# OSSF scorecard-action signature verifier. Any flag formerly set
# here MUST move to step-level env, otherwise the signature step
# rejects the workflow with "workflow contains global env vars or
# defaults". See:
#   https://github.com/ossf/scorecard-action#workflow-restrictions

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # Scorecard v2.4.4 predates GitHub's `$/` self-repository syntax and
      # misreports every `uses: $/…` reference as an unpinned third-party
      # action (28 false PinnedDependenciesID alerts). Reverting the syntax is
      # not an option: zizmor's `self-repository` audit requires `$/` and
      # GitHub treats it as a form of pinning. So strip only those false
      # positives from the SARIF before it is uploaded — a genuinely unpinned
      # third-party action never matches `$/`, so it is still reported.
      # See docs/workflow/code-scanning.md and ossf/scorecard#5191.
      - name: Drop $/ self-repository false positives from the SARIF
        run: node scripts/filter-scorecard-sarif.mjs results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
