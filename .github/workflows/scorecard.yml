name: OSSF Scorecard

on:
  schedule:
    - cron: '30 2 * * 1'
  # On-demand runs. The weekly cadence alone meant a dependency fixed on a
  # Tuesday stayed reported until the following Monday — alert 63 sat open as
  # "high" for days after `9ebcbc7` had already fixed both browserslist
  # advisories it named, with no way to ask for a re-scan. See
  # docs/workflow/code-scanning.md for how to triage what it reports.
  workflow_dispatch:
    inputs:
      audit_dry_run:
        description: Report npm advisories without creating, editing or closing the report issue.
        type: boolean
        default: true

permissions: {}

# NOTE: workflow-root `env:` and `defaults:` are forbidden by the
# OSSF scorecard-action signature verifier. Any flag formerly set
# here MUST move to step-level env, otherwise the signature step
# rejects the workflow with "workflow contains global env vars or
# defaults". See:
#   https://github.com/ossf/scorecard-action#workflow-restrictions

jobs:
  npm-audit:
    name: npm dependency audit
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-dependency-audit
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
      - name: Audit the locked dependency graph
        id: audit
        run: node scripts/npm-audit-watch.mjs --out "$RUNNER_TEMP/npm-audit.md"
      - name: Update the dependency audit issue
        if: ${{ !inputs.audit_dry_run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIT_CLEAN: ${{ steps.audit.outputs.clean }}
        with:
          github-token: ${{ github.token }}
          retries: 0
          script: |
            const { readFileSync } = await import('node:fs');
            const { join } = await import('node:path');
            const { updateAuditIssue } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/npm-audit/issue.mjs`
            );
            if (!['true', 'false'].includes(process.env.AUDIT_CLEAN)) {
              throw new Error('Missing verified npm audit result');
            }
            const body = readFileSync(join(process.env.RUNNER_TEMP, 'npm-audit.md'), 'utf8');
            const source = `\nScanned commit: ${context.sha}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            await updateAuditIssue(github.rest.issues, context.repo, {
              body: body + source,
              clean: process.env.AUDIT_CLEAN === 'true',
            });

  # With `publish_results: true` the scorecard.dev API rejects the run unless
  # every step of this job is an approved `uses:` action (checkout,
  # upload-artifact, upload-sarif, scorecard-action, harden-runner), and only
  # this job may hold `id-token: write`. Any `run:` step therefore lives in
  # `analysis` below. See
  #   https://github.com/ossf/scorecard-action#workflow-restrictions
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read only: the SAST check queries code scanning; uploading moved below.
      security-events: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

  # Scorecard v2.4.4 predates GitHub's `$/` self-repository syntax and
  # misreports every `uses: $/…` reference as an unpinned third-party action
  # (28 false PinnedDependenciesID alerts). Reverting the syntax is not an
  # option: zizmor's `self-repository` audit requires `$/` and GitHub treats
  # it as a form of pinning. So strip only those false positives from the
  # SARIF before it is uploaded — a genuinely unpinned third-party action
  # never matches `$/`, so it is still reported. The downloaded copy is owned
  # by the runner user; the original is written as root by the Scorecard
  # container and cannot be rewritten in place.
  # See docs/workflow/code-scanning.md and ossf/scorecard#5191.
  #
  # Keep this job key `analysis`. upload-sarif files each upload under
  # `<workflow path>:<job key>`, and every existing Scorecard alert belongs to
  # `.github/workflows/scorecard.yml:analysis`. Under another key those
  # alerts would never close without a manual configuration delete.
  analysis:
    name: Upload filtered SARIF
    needs: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SARIF file
      - name: Drop $/ self-repository false positives from the SARIF
        run: node scripts/filter-scorecard-sarif.mjs results.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
