name: 'Clear needs-info when the reporter replies'

# The companion to the `no-response` job in `stale.yml`.
#
# That job closes issues that sit seven days under the `needs-info` label, and
# `actions/stale` cannot tell whose turn it is — it only sees that an issue is
# quiet. The label is the state machine, so something has to clear it the
# moment the reporter answers. `labels-to-remove-when-unstale` is not that
# something: it fires only for an issue that was already marked stale, so it
# never covers a reply inside the first seven days. Without this workflow, an
# issue the reporter *did* answer would still be closed for silence.

on:
  issue_comment:
    types: [created]

permissions: {}

# Serialised per issue: a reporter posting twice in quick succession would
# otherwise start two runs that both try to remove the same label, and the
# loser would fail on a label that is already gone.
concurrency:
  group: clear-needs-info-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  clear-needs-info:
    # `issue_comment` also fires for pull-request comments, hence the first
    # clause. The second is the whole point: only the person who opened the
    # issue can satisfy a request made of them.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'needs-info')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Remove the waiting label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: 'needs-info'
        # Every value above is an identifier or a number that GitHub controls,
        # never comment or title text, so nothing attacker-controlled reaches
        # the shell. Losing a race to another remover — the stale job's own
        # `labels-to-remove-when-stale`, or a second rapid comment — is an
        # expected outcome, not a failure, so it is distinguished from a
        # genuine API error rather than blanket-ignored. The label list is read
        # into a variable rather than piped, because `pipefail` would otherwise
        # let a `SIGPIPE` from the early exit of `grep -q` look like a failed
        # lookup and silently take the "already absent" branch. It is read with
        # `--paginate` because the endpoint pages at 30: on an issue carrying
        # more labels than that, a first-page-only read could miss the label
        # and leave it in place, auto-closing an issue the reporter had in
        # fact answered — the one outcome this lane must never produce.
        run: |
          has_label() {
            local labels
            labels=$(gh api --paginate \
              "repos/$REPO/issues/$ISSUE_NUMBER/labels" --jq '.[].name')
            grep -qx "$LABEL" <<<"$labels"
          }

          if ! has_label; then
            echo "'$LABEL' already absent from #$ISSUE_NUMBER; nothing to do."
            exit 0
          fi

          if gh api --method DELETE \
            "repos/$REPO/issues/$ISSUE_NUMBER/labels/$LABEL" --silent; then
            echo "Removed '$LABEL' from #$ISSUE_NUMBER — the reporter replied."
            exit 0
          fi

          if has_label; then
            echo "::error::Could not remove '$LABEL' from #$ISSUE_NUMBER."
            exit 1
          fi

          echo "'$LABEL' removed concurrently on #$ISSUE_NUMBER; nothing to do."
