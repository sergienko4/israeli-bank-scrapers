name: SonarCloud

# The post-merge scan of `main`, which sets SonarCloud's new-code baseline.
# Pull requests are scanned by the `SonarCloud Scan` job in `pr.yml`, which
# reuses the floor `Unit tests` leg's coverage instead of running the suite
# again; that job is what produces the required `SonarCloud Scan` context.
on:
  # `push: main` intentionally absent — main-pipeline.yml calls this via
  # workflow_call, so the scan runs inside the pipeline DAG on every merge.
  workflow_call:
    # Declared explicitly rather than relying on `secrets: inherit` at the
    # call site: inherit hands the callee *every* repo secret, which zizmor
    # flags (`secrets-inherit`) because it widens the blast radius of a
    # compromised action far beyond the three Sonar credentials this
    # workflow actually reads. Optional so the `workflow_dispatch` trigger
    # below keeps resolving them from repo secrets; the "Verify secrets"
    # step already fails loudly if unset.
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_ORG:
        required: false
      SONAR_PROJECT_KEY:
        required: false
  workflow_dispatch:

permissions: {}

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Closes zizmor `artipacked` (persisted credentials warning).
          persist-credentials: false

      # Single source of truth for "did src/** change?" — the same script
      # pr.yml's `changes` job runs. Keeps the two path decisions in step.
      - name: Detect changed file groups
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/ci/detect-changes.sh

      # Merges that touch no src/**: short-circuit and report green.
      - name: Skip — no src/** changes
        if: steps.changes.outputs.src == 'false'
        run: |
          set -euo pipefail
          echo "No src/** changes in this push — SonarCloud Scan reports green without running."
          echo "Real-scan trigger paths: src/**. If this push DOES include src/** changes,"
          echo "recheck .github/scripts/ci/detect-changes.sh — the real scan should have run."

      - name: Setup Node + Dependencies
        if: steps.changes.outputs.src == 'true'
        uses: $/.github/actions/setup-node-deps

      - name: Run unit tests with coverage
        if: steps.changes.outputs.src == 'true'
        run: npm run test:pipeline
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Verify SonarCloud secrets
        if: steps.changes.outputs.src == 'true'
        run: |
          set -euo pipefail
          missing=""
          [ -z "${SONAR_TOKEN}" ] && missing="${missing} SONAR_TOKEN"
          [ -z "${SONAR_ORG}" ] && missing="${missing} SONAR_ORG"
          [ -z "${SONAR_PROJECT_KEY}" ] && missing="${missing} SONAR_PROJECT_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::Missing secrets:${missing} — add in Settings → Secrets → Actions."
            exit 1
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

      - name: SonarCloud Scan
        if: steps.changes.outputs.src == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

