name: Main Pipeline

# Single post-merge entry point.
#
# Before this workflow, one merge to main fanned out into six independent
# workflow runs (PR Validation, CodeQL, SonarCloud, Workflow Security,
# Publish Docs, Release & Publish). Nothing tied them together, so answering
# "did this merge land cleanly?" meant opening six runs and reading them
# separately - and PR Validation re-ran ~22 jobs that had already passed on
# the PR minutes earlier.
#
# Now: one merge, one run, one summary — verification *and* release.
#
# ──────────────────────────────────────────────────────────────
#   changes ──→ docs (if needed) ─┐
#   codeql ───────────────────────┤
#   sonarcloud ───────────────────┼─→ summary (always)
#   workflow-security ────────────┤
#   release ──────────────────────┘
# ──────────────────────────────────────────────────────────────
#
# Only `docs` is gated, on `changes` — it republishes the site solely when
# docs-relevant files moved. Everything else starts immediately.
#
# `release` is not gated on the scans finishing. That is deliberate: it
# preserves the behaviour release had as a standalone workflow, where a
# flaky Sonar run could never block cutting a release. The DAG reports both
# branches; it does not couple them.
#
# npm Trusted Publishing: this file is the publisher identity. npm's docs are
# explicit that for `workflow_call`, "validation checks the calling workflow's
# name instead of the workflow that actually contains the publish command", and
# that `id-token: write` "must also be given to both parent and child
# workflows" (https://docs.npmjs.com/trusted-publishers/, Troubleshooting).
# Because `release.yml` is invoked from here, the trusted publisher configured
# on npmjs.com must name **main-pipeline.yml**. Renaming this file, or moving
# the release call into another workflow, breaks publishing until that
# setting is repointed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish to npm even when release-please cut no release (recovers from tag glitches)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions: {}

# `cancel-in-progress: false` because this run can publish to npm, and a
# cancelled publish is worse than a queued one. Verification alone would be
# safe to supersede — a newer merge contains the older commit's code — but
# concurrency is a workflow-level setting, so the release constraint wins.
concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_publish: ${{ steps.gate.outputs.docs_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed file groups
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/ci/detect-changes.sh

      # A reusable workflow call cannot carry a `paths:` filter, so the file
      # groups that used to gate docs.yml's `push:` trigger are recomputed
      # here. src/docs/md/deps/ci_scripts together cover the old path list
      # (src/**, docs/**, README.md, mkdocs.yml, requirements-docs.txt,
      # typedoc.json, package.json, .github/workflows/docs.yml).
      - name: Decide whether docs need publishing
        id: gate
        env:
          SRC: ${{ steps.changes.outputs.src }}
          DOCS: ${{ steps.changes.outputs.docs }}
          MD: ${{ steps.changes.outputs.md }}
          DEPS: ${{ steps.changes.outputs.deps }}
          CI_SCRIPTS: ${{ steps.changes.outputs.ci_scripts }}
        run: |
          set -euo pipefail
          publish=false
          for flag in "$SRC" "$DOCS" "$MD" "$DEPS" "$CI_SCRIPTS"; do
            if [ "$flag" = "true" ]; then publish=true; fi
          done
          echo "docs_publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "docs_publish=${publish}"

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  sonarcloud:
    name: SonarCloud
    uses: ./.github/workflows/sonarcloud.yml
    permissions:
      contents: read
      pull-requests: read
    # Explicit passthrough, not `secrets: inherit` — inherit would hand the
    # callee every repo secret (npm tokens, bank E2E credentials) when it
    # only needs these three. Closes zizmor `secrets-inherit`.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: ${{ secrets.SONAR_ORG }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

  workflow-security:
    name: Workflow security
    uses: ./.github/workflows/workflow-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs_publish == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Cutting a release is independent of the scans above — see the header note.
  # On an ordinary merge this only opens or refreshes the Release PR; the npm
  # publish happens on the merge of that Release PR, when `release_created`
  # flips to true.
  release:
    name: Release
    uses: ./.github/workflows/release.yml
    # The union of what the called jobs need: release-please writes release
    # commits and PRs, publish exchanges the OIDC token. A called workflow
    # cannot exceed the permissions granted here, and each of its jobs
    # narrows further.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      # `inputs` is null on push, so the dispatch-only knob defaults off.
      force_publish: ${{ inputs.force_publish || 'false' }}
    # Explicit passthrough, not `secrets: inherit` — same reasoning as
    # sonarcloud above.
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # The whole point of the pipeline: one place that answers "did this merge
  # land cleanly?". Runs even when something upstream fails, otherwise the
  # summary would be missing exactly when it is most needed.
  summary:
    name: Pipeline summary
    if: always()
    needs: [changes, codeql, sonarcloud, workflow-security, docs, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the pipeline DAG and result table
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_CODEQL: ${{ needs.codeql.result }}
          R_SONAR: ${{ needs.sonarcloud.result }}
          R_WFSEC: ${{ needs.workflow-security.result }}
          R_DOCS: ${{ needs.docs.result }}
          R_RELEASE: ${{ needs.release.result }}
          RELEASED: ${{ needs.release.outputs.release_created }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/ci/pipeline-summary.sh
