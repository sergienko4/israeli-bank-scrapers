name: Browser stack watch

# Which playwright-core × Camoufox pairs does the browser-stack gate accept
# today? The playwright-core version this library's `^` range resolves to
# and the Camoufox release camoufox-js installs both move without a PR here,
# so nothing else in CI would notice either one change.
#
# Once a week, `scripts/browser-stack-watch.mjs` runs the gate in candidate
# mode on every candidate pair and writes one markdown report: the consumer
# pair (the range's version × the release camoufox-js selects), CI drift (is the
# manifest's tag that release?) and a candidate table. This workflow keeps the
# report as the body of one open issue labelled `browser-stack` that the
# workflow itself opened. It edits that body and never comments, so a re-run
# replaces the report rather than adding to it, and an issue a person labels
# keeps its body. Compatible is not landable: the gate checks the Juggler
# protocol only. See docs/architecture/browser-stack.md.
#
# A manual run is a dry run unless `dry_run` is cleared: it prints the report
# to the log and the job summary and leaves the issue alone.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report only; do not create or edit the issue.
        type: boolean
        default: true

permissions: {}

# A dispatch during the scheduled run waits instead of racing it to create
# the issue.
concurrency:
  group: browser-stack-watch
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  watch:
    name: Report compatible browser-stack pairs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      issues: write # create the label and the issue, edit its body
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Exits 2 when it cannot read its inputs; the job then fails and the
      # issue keeps last week's report. The token only raises the GitHub API
      # rate limit for the releases page.
      - name: Watch the browser stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/browser-stack-watch.mjs --out "$RUNNER_TEMP/browser-stack-watch.md"
          cat "$RUNNER_TEMP/browser-stack-watch.md" >> "$GITHUB_STEP_SUMMARY"
      # `inputs` is empty on the schedule, so `!inputs.dry_run` holds there.
      # `github.event.inputs.dry_run` would be the string 'false', which `!`
      # turns into false: the boolean `inputs` context is the one to read.
      - name: Update the watch issue
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create browser-stack --force --color 5319e7 \
            --description 'Weekly browser-stack watch report'
          number=$(gh issue list --label browser-stack --state open --limit 100 \
            --json number,author \
            --jq '[.[] | select(.author.login == "app/github-actions")][0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/browser-stack-watch.md"
          else
            gh issue create --title 'Browser stack watch' --label browser-stack \
              --body-file "$RUNNER_TEMP/browser-stack-watch.md"
          fi
